name: MIMIC-IV FHIR demo benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Full official demo, or seven-file core subset"
        type: choice
        options: [full, core]
        default: full
      repetitions:
        description: "Measured runs on identical inputs"
        type: choice
        options: ['2', '3']
        default: '3'
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: mimic-demo-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    # An owner-authored issue is an explicit benchmark request; arbitrary public
    # issues must not start resource-intensive jobs with write permission.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == '[benchmark] Run full MIMIC-IV FHIR demo' &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validator
        run: python -m pip install .
      - name: Download official MIMIC-IV FHIR demo, verify checksums
        shell: bash
        run: |
          set -euo pipefail
          opts=()
          if [[ "${{ inputs.dataset }}" == 'core' ]]; then opts+=(--core); fi
          python benchmarks/download_mimic.py --destination private/mimic "${opts[@]}"
      - name: Benchmark end-to-end (three independent trials by default)
        shell: bash
        run: |
          set -euo pipefail
          dataset=full
          if [[ "${{ inputs.dataset }}" == 'core' ]]; then dataset=core; fi
          python benchmarks/bench.py \
            --input private/mimic/*.ndjson.gz \
            --reference-scope open \
            --repeat '${{ inputs.repetitions || '3' }}' \
            --dataset-label "mimic-iv-fhir-demo-2.1.0-${dataset}" \
            --output benchmark-summary.json
      - name: Upload aggregate results only (no patient resources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimic-iv-fhir-demo-results-${{ github.run_id }}
          path: benchmark-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified aggregate measurements in repository
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          dataset=full
          if [[ "${{ inputs.dataset }}" == 'core' ]]; then dataset=core; fi
          target="benchmarks/results/mimic-iv-fhir-demo-2.1.0-${dataset}.json"
          cp benchmark-summary.json "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'Aggregate result unchanged'
          else
            git commit -m "Record checksum-verified MIMIC-IV FHIR demo ${dataset} benchmark"
            git push origin HEAD:main
          fi
