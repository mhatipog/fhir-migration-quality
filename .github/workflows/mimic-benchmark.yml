name: MIMIC-IV FHIR demo benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Full official demo or seven-file core subset"
        type: choice
        options: [core, full]
        default: core
      repetitions:
        description: "Measured runs on identical inputs"
        type: choice
        options: ['2', '3']
        default: '3'
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: mimic-demo-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    # Only an issue opened by the repository owner may trigger an expensive run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (github.event.issue.title == '[benchmark] Run core MIMIC-IV FHIR demo' ||
        github.event.issue.title == '[benchmark] Run full MIMIC-IV FHIR demo'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BENCH_DATASET: ${{ github.event_name == 'issues' && github.event.issue.title == '[benchmark] Run core MIMIC-IV FHIR demo' && 'core' || inputs.dataset || 'full' }}
      BENCH_REPETITIONS: ${{ inputs.repetitions || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validator
        run: python -m pip install .
      - name: Download official MIMIC-IV FHIR demo and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$BENCH_DATASET" == 'core' ]]; then args+=(--core); fi
          workers=2
          if [[ "$BENCH_DATASET" == 'core' ]]; then workers=1; fi
          python -u benchmarks/download_mimic.py \
            --destination private/mimic --attempts 10 --timeout 120 \
            --workers "$workers" "${args[@]}"
      - name: Benchmark end-to-end
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/bench.py \
            --input private/mimic/*.ndjson.gz \
            --reference-scope open \
            --repeat "$BENCH_REPETITIONS" \
            --dataset-label "mimic-iv-fhir-demo-2.1.0-${BENCH_DATASET}" \
            --output benchmark-summary.json
      - name: Upload aggregate results only (no patient resources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mimic-iv-fhir-demo-results-${{ github.run_id }}
          path: benchmark-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified aggregate measurements
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target="benchmarks/results/mimic-iv-fhir-demo-2.1.0-${BENCH_DATASET}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Another benchmark may have published while this run was downloading.
          # Rebase the *generated result*, not the runner's old source checkout.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B benchmark-publication origin/main
            cp benchmark-summary.json "$target"
            git add "$target"
            if git diff --cached --quiet; then
              echo 'Aggregate result unchanged'
              break
            fi
            git commit -m "Record checksum-verified MIMIC-IV FHIR demo ${BENCH_DATASET} benchmark"
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 3 ]]; then
              echo 'Could not publish aggregate results after three retries' >&2
              exit 1
            fi
          done
